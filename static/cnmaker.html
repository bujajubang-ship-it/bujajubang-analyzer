<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CN메이커 — 부자주방 상세페이지 자동생성</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Pretendard','Malgun Gothic',sans-serif;background:#f4f6fa;color:#1f2937}
.top{background:#D70010;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1}
.wrap{max-width:760px;margin:0 auto;padding:22px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:18px}
.card h2{font-size:16px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{flex:1;min-width:140px;border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;font-size:14px;font-weight:600;transition:.15s}
.tab .ico{font-size:22px;display:block;margin-bottom:4px}
.tab .sub{font-size:11px;color:#9ca3af;font-weight:400;margin-top:3px}
.tab.on{border-color:#D70010;background:#fff5f5;color:#D70010}
.tab.on .sub{color:#D70010}
input.url{width:100%;padding:13px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:12px}
input.url:focus,input.t:focus{outline:none;border-color:#D70010}
input.t{width:100%;padding:11px 14px;border:2px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:12px}
button.go{background:#D70010;color:#fff;border:none;border-radius:10px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer}
button.go:disabled{background:#d1a0a3;cursor:not-allowed}
.note{font-size:12px;color:#9ca3af;margin-top:8px;line-height:1.6}
.drop{border:2px dashed #d1d5db;border-radius:12px;padding:26px;text-align:center;color:#9ca3af;cursor:pointer;margin-bottom:12px}
.drop.over{border-color:#D70010;background:#fff5f5}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.thumb{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid #eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;text-align:center;line-height:18px;cursor:pointer}
#progress{display:none}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;color:#9ca3af}
.step.active{color:#D70010;font-weight:700}.step.done{color:#059669}
.step .ico{width:24px;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #f3d0d2;border-top-color:#D70010;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#result{display:none;text-align:center}
#result img{max-width:100%;border:1px solid #eee;border-radius:8px}
.dlbtn{display:inline-block;margin-top:14px;background:#1f2937;color:#fff;text-decoration:none;padding:12px 26px;border-radius:10px;font-weight:600}
.err{background:#fef2f2;color:#b91c1c;padding:12px 14px;border-radius:8px;font-size:13px;margin-top:10px}
.copybox{background:#faf5ff;border-radius:10px;padding:14px;margin-top:14px;text-align:left;font-size:13px;line-height:1.8}
.copybox b{color:#D70010}
</style></head><body>
<div class="top"><h1>🏭 CN메이커 — 부자주방 상세페이지 자동생성</h1></div>
<div class="wrap">
 <div class="card">
   <div class="tabs">
     <div class="tab on" data-src="cninsider" data-mode="url"><span class="ico">🟠</span>CN인사이더<div class="sub">URL 자동</div></div>
     <div class="tab" data-src="cafe24" data-mode="url"><span class="ico">🟣</span>자사몰(카페24)<div class="sub">URL 자동</div></div>
     <div class="tab" data-src="naver" data-mode="img"><span class="ico">🟢</span>네이버<div class="sub">이미지 업로드</div></div>
     <div class="tab" data-src="coupang" data-mode="img"><span class="ico">🔵</span>쿠팡<div class="sub">이미지 업로드</div></div>
   </div>

   <!-- URL 모드 -->
   <div id="urlmode">
     <input class="url" id="url" placeholder="상품 페이지 URL 붙여넣기">
     <div class="note" id="urlnote"></div>
   </div>

   <!-- 이미지 업로드 모드 -->
   <div id="imgmode" style="display:none">
     <input class="t" id="title" placeholder="상품명/메모 (선택 — 적으면 카피가 더 정확해져요)">
     <div class="drop" id="drop">📷 상품 이미지를 끌어다 놓거나 클릭해서 선택<br><span style="font-size:12px">(경쟁사 페이지 캡쳐·제품샷 여러 장)</span></div>
     <input type="file" id="file" accept="image/*" multiple style="display:none">
     <div class="thumbs" id="thumbs"></div>
     <div class="note">네이버·쿠팡은 자동 수집이 막혀있어, 상품 이미지를 직접 올리면 → AI가 분석해 부자주방 스타일로 만들어드립니다.</div>
   </div>

   <div style="display:flex;gap:14px;align-items:center;margin:12px 0 6px;flex-wrap:wrap">
     <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px">
       <input type="radio" name="cat" id="cat_kitchen" value="kitchen" checked style="width:18px;height:18px">
       <span>🍳 <b>주방기구</b> <span style="color:#9ca3af;font-size:12px">(부자주방 로고·빨강 스타일)</span></span>
     </label>
     <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px">
       <input type="radio" name="cat" id="cat_other" value="other" style="width:18px;height:18px">
       <span>📦 <b>기타 제품</b> <span style="color:#9ca3af;font-size:12px">(원본 톤 살려 색만 변형, 로고 없음)</span></span>
     </label>
   </div>
   <button class="go" id="go" onclick="go()" style="margin-top:6px">상세페이지 만들기 🚀</button>
   <div id="err"></div>
 </div>

 <div class="card" id="progress">
   <h2>진행 상황</h2>
   <div class="step" id="s1"><span class="ico">①</span> <span id="l1">상품 수집</span></div>
   <div class="step" id="s2"><span class="ico">②</span> 카피 생성 (Opus 4.8)</div>
   <div class="step" id="s3"><span class="ico">③</span> 이미지 선별·정리</div>
   <div class="step" id="s4"><span class="ico">④</span> 부자주방 스타일 합성</div>
   <div class="note" id="pmsg" style="margin-top:10px"></div>
 </div>

 <div class="card" id="result">
   <h2 id="rtitle">✅ 완성!</h2>
   <div class="copybox" id="copybox"></div>
   <img id="rimg">
   <div><a class="dlbtn" id="dl" download="상세페이지.jpg">⬇️ 상세페이지 다운로드</a></div>
 </div>
</div>
<script>
let job=null,timer=null,mode="url",src="cninsider",files=[];
const NOTES={cninsider:"CN인사이더 상품 URL을 넣으면 → 자동 로그인 → 중국어 번역 → 이미지 정리 → 부자주방 스타일 (약 1~2분)",
 cafe24:"자사몰(카페24) 상품 URL을 넣으면 → 상품정보·이미지 수집 → 부자주방 스타일로 재구성"};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  src=t.dataset.src; mode=t.dataset.mode;
  document.getElementById('urlmode').style.display = mode==='url'?'':'none';
  document.getElementById('imgmode').style.display = mode==='img'?'':'none';
  document.getElementById('urlnote').textContent = NOTES[src]||'';
  document.getElementById('l1').textContent = mode==='url'?'상품 수집':'이미지 분석';
});
document.getElementById('urlnote').textContent=NOTES.cninsider;
// 파일 업로드
const drop=document.getElementById('drop'),fileInput=document.getElementById('file');
drop.onclick=()=>fileInput.click();
fileInput.onchange=e=>addFiles(e.target.files);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function addFiles(fl){
  [...fl].forEach(f=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{files.push(r.result);renderThumbs();};r.readAsDataURL(f);});
}
function renderThumbs(){
  document.getElementById('thumbs').innerHTML=files.map((d,i)=>`<div class="thumb"><img src="${d}"><div class="x" onclick="files.splice(${i},1);renderThumbs()">×</div></div>`).join('');
}
function go(){
  document.getElementById('err').innerHTML='';
  const category=document.getElementById('cat_kitchen').checked?'kitchen':'other';
  if(mode==='url'){
    const url=document.getElementById('url').value.trim();
    if(!url.startsWith('http')){return fail('상품 URL을 넣어주세요.');}
    begin();
    fetch('/cnmaker/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,category})})
      .then(r=>r.json()).then(d=>d.error?fail(d.error):(job=d.job_id,poll())).catch(()=>fail('요청 실패'));
  } else {
    if(!files.length){return fail('상품 이미지를 1장 이상 올려주세요.');}
    begin();
    fetch('/cnmaker/api/start_imgs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:files,title:document.getElementById('title').value.trim(),category})})
      .then(r=>r.json()).then(d=>d.error?fail(d.error):(job=d.job_id,poll())).catch(()=>fail('요청 실패'));
  }
}
function begin(){document.getElementById('go').disabled=true;document.getElementById('progress').style.display='block';document.getElementById('result').style.display='none';setStep(1);}
function setStep(active){const nums=['','①','②','③','④'];for(let i=1;i<=4;i++){const e=document.getElementById('s'+i);e.className='step'+(i<active?' done':i===active?' active':'');e.querySelector('.ico').innerHTML=i<active?'✓':(i===active?'<span class="spin"></span>':nums[i]);}}
function poll(){timer=setInterval(()=>{fetch('/cnmaker/api/status?job='+job).then(r=>r.json()).then(d=>{
  const m=d.msg||'';document.getElementById('pmsg').textContent=m;
  if(m.includes('스크래핑')||m.includes('로그인')||m.includes('캡차')||m.includes('분석')||m.includes('시작')) setStep(1);
  else if(m.includes('번역')||m.includes('카피')) setStep(2);
  else if(m.includes('평가')||m.includes('선별')) setStep(3);
  else if(m.includes('합성')) setStep(4);
  if(d.status==='done'){clearInterval(timer);done(d);}else if(d.status==='error'){clearInterval(timer);fail(d.error||'처리 실패');}
}).catch(()=>{});},2500);}
function done(d){for(let i=1;i<=4;i++){const e=document.getElementById('s'+i);e.className='step done';e.querySelector('.ico').textContent='✓';}
  document.getElementById('go').disabled=false;document.getElementById('result').style.display='block';
  document.getElementById('rtitle').textContent='✅ '+(d.product_name||'완성!');
  const c=d.copy||{};document.getElementById('copybox').innerHTML=(c.headline?'<b>헤드라인:</b> '+c.headline+'<br>':'')+(c.sub_headline?'<b>서브:</b> '+c.sub_headline+'<br>':'')+(c.key_features?'<b>특징:</b><br>'+c.key_features.replace(/\n/g,'<br>'):'');
  const s='/cnmaker/api/result?job='+job+'&t='+Date.now();document.getElementById('rimg').src=s;document.getElementById('dl').href=s;
  document.getElementById('result').scrollIntoView({behavior:'smooth'});}
function fail(msg){if(timer)clearInterval(timer);document.getElementById('go').disabled=false;document.getElementById('err').innerHTML='<div class=err>'+msg+'</div>';}
</script></body></html>
