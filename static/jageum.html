<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>부자홀딩스 자금일보</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Malgun Gothic',sans-serif;background:#f4f6fa;color:#1f2937}
.top{background:#5b21b6;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0}.top .sub{font-size:13px;opacity:.85}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.kpi .l{font-size:13px;color:#6b7280}.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi.in .v{color:#059669}.kpi.out .v{color:#dc2626}.kpi.net .v{color:#2563eb}
.card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #eef0f4;text-align:left;white-space:nowrap}
th{color:#6b7280;font-weight:600;background:#fafafe;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:420px;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{border:1px solid #d1d5db;background:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.tabs button.on{background:#5b21b6;color:#fff;border-color:#5b21b6}
input.search{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:10px;font-size:13px}
.bar{height:8px;background:#ede9fe;border-radius:4px;overflow:hidden}.bar>span{display:block;height:100%;background:#7c3aed}
.muted{color:#9ca3af}
</style></head><body>
<div class="top"><h1>💰 부자홀딩스 자금일보</h1><span class="sub" id="period">불러오는 중…</span></div>
<div class="wrap">
 <div class="kpis">
  <div class="kpi in"><div class="l">총 입금 (자금의 증가)</div><div class="v" id="k_in">-</div></div>
  <div class="kpi out"><div class="l">총 출금 (자금의 감소)</div><div class="v" id="k_out">-</div></div>
  <div class="kpi net"><div class="l">순 현금흐름</div><div class="v" id="k_net">-</div></div>
  <div class="kpi"><div class="l">보통예금 잔액 합계</div><div class="v" id="k_bal">-</div></div>
 </div>
 <div class="card"><h2>📈 일자별 입금 vs 출금</h2><canvas id="chartDaily" height="90"></canvas></div>
 <div class="grid2">
  <div class="card"><h2>🏦 은행/계정별 잔액 (금일)</h2><div class="scroll"><table id="t_bal"><thead><tr><th>계정</th><th>거래처(계좌)</th><th class="num">금일잔액</th></tr></thead><tbody></tbody></table></div></div>
  <div class="card"><h2>🧾 부서·프로젝트별 집계</h2>
    <div class="tabs" id="aggtabs"><button class="on" data-k="부서명">부서별</button><button data-k="프로젝트명">프로젝트별</button></div>
    <div class="scroll"><table id="t_agg"><thead><tr><th>구분</th><th class="num">입금</th><th class="num">출금</th><th class="num">순액</th></tr></thead><tbody></tbody></table></div></div>
 </div>
 <div class="grid2">
  <div class="card"><h2>⬆️ 입금처 TOP (거래처)</h2><div class="scroll"><table id="t_in_top"><thead><tr><th>거래처</th><th class="num">금액</th><th>비중</th></tr></thead><tbody></tbody></table></div></div>
  <div class="card"><h2>⬇️ 출금처 TOP (거래처)</h2><div class="scroll"><table id="t_out_top"><thead><tr><th>거래처</th><th class="num">금액</th><th>비중</th></tr></thead><tbody></tbody></table></div></div>
 </div>
 <div class="card"><h2>📋 상세 내역</h2>
   <div class="tabs" id="dtabs"><button class="on" data-k="자금의증가">입금 상세</button><button data-k="자금의감소">출금 상세</button></div>
   <input class="search" id="dsearch" placeholder="거래처·적요·부서·프로젝트 검색…">
   <div class="scroll"><table id="t_detail"><thead><tr><th>일자</th><th>상대계정</th><th>거래처</th><th>적요</th><th class="num">금액</th><th>부서</th><th>프로젝트</th></tr></thead><tbody></tbody></table></div>
   <div class="muted" id="dcount" style="margin-top:8px;font-size:12px"></div>
 </div>
 <div class="muted" style="font-size:12px;text-align:center;padding:10px">이카운트 자금일보 자동 수집 · 매일 갱신</div>
</div>
<script>
const won=n=>(n<0?'-':'')+'₩'+Math.abs(n).toLocaleString();
let D={}, dailyChart;
function sum(a,f){return a.reduce((s,x)=>s+(f?f(x):0),0)}
function aggBy(rows,key){const m={};rows.forEach(r=>{const k=r[key]||'(미지정)';m[k]=(m[k]||0)+r.금액});return m}
function load(){fetch('/jageum/api/data').then(r=>r.json()).then(d=>{D=d;render()}).catch(e=>{period.textContent='데이터 없음 (아직 수집 전)'})}
function render(){
 const inc=D.자금의증가||[], dec=D.자금의감소||[], bal=D.자금현황||[];
 document.getElementById('period').textContent='기간: '+(D.period||'-');
 const tin=sum(inc,x=>x.금액), tout=sum(dec,x=>x.금액);
 k_in.textContent=won(tin); k_out.textContent=won(tout); k_net.textContent=won(tin-tout);
 const bote=bal.filter(b=>(b.계정명||'').includes('보통예금'));
 k_bal.textContent=won(sum(bote,x=>x.금일잔액));
 const days={}; inc.forEach(r=>{(days[r.일자]=days[r.일자]||[0,0])[0]+=r.금액}); dec.forEach(r=>{(days[r.일자]=days[r.일자]||[0,0])[1]+=r.금액});
 const labels=Object.keys(days).sort();
 if(dailyChart)dailyChart.destroy();
 dailyChart=new Chart(chartDaily,{type:'bar',data:{labels:labels.map(l=>l.slice(5)),datasets:[
   {label:'입금',data:labels.map(l=>days[l][0]),backgroundColor:'#10b981'},
   {label:'출금',data:labels.map(l=>days[l][1]),backgroundColor:'#ef4444'}]},
   options:{responsive:true,scales:{y:{ticks:{callback:v=>(v/1e6)+'백만'}}},plugins:{legend:{position:'top'}}}});
 fill('t_bal',bote.length?bote:bal,r=>`<td>${r.계정명||''}</td><td>${r.거래처명||''}</td><td class="num">${(r.금일잔액||0).toLocaleString()}</td>`);
 topTable('t_in_top',aggBy(inc,'거래처명'),tin);
 topTable('t_out_top',aggBy(dec,'거래처명'),tout);
 renderAgg(); renderDetail();
}
function fill(id,rows,row){document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+row(r)+'</tr>').join('')}
function topTable(id,m,tot){const a=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,15);
 document.querySelector('#'+id+' tbody').innerHTML=a.map(([k,v])=>`<tr><td>${k||'(미지정)'}</td><td class="num">${v.toLocaleString()}</td><td style="width:90px"><div class="bar"><span style="width:${tot?Math.round(v/tot*100):0}%"></span></div></td></tr>`).join('')}
let aggKey='부서명';
function renderAgg(){const inc=D.자금의증가||[],dec=D.자금의감소||[];
 const i=aggBy(inc,aggKey),o=aggBy(dec,aggKey);const keys=[...new Set([...Object.keys(i),...Object.keys(o)])];
 keys.sort((a,b)=>((i[b]||0)+(o[b]||0))-((i[a]||0)+(o[a]||0)));
 document.querySelector('#t_agg tbody').innerHTML=keys.map(k=>`<tr><td>${k}</td><td class="num" style="color:#059669">${(i[k]||0).toLocaleString()}</td><td class="num" style="color:#dc2626">${(o[k]||0).toLocaleString()}</td><td class="num">${((i[k]||0)-(o[k]||0)).toLocaleString()}</td></tr>`).join('')}
let dKey='자금의증가';
function renderDetail(){const q=(dsearch.value||'').trim();let rows=D[dKey]||[];
 if(q)rows=rows.filter(r=>[r.거래처명,r.적요,r.부서명,r.프로젝트명,r.상대계정명].join(' ').includes(q));
 document.querySelector('#t_detail tbody').innerHTML=rows.map(r=>`<tr><td>${r.일자||''}</td><td>${r.상대계정명||''}</td><td>${r.거래처명||''}</td><td>${r.적요||''}</td><td class="num">${(r.금액||0).toLocaleString()}</td><td>${r.부서명||''}</td><td>${r.프로젝트명||''}</td></tr>`).join('');
 dcount.textContent=`${rows.length}건 · 합계 ${won(sum(rows,x=>x.금액))}`}
document.querySelectorAll('#aggtabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#aggtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');aggKey=b.dataset.k;renderAgg()});
document.querySelectorAll('#dtabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');dKey=b.dataset.k;renderDetail()});
dsearch.oninput=renderDetail;
load();
</script></body></html>
